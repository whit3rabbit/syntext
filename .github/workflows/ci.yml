name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep_15.2.0-1_amd64.deb
          sudo dpkg -i ripgrep_15.2.0-1_amd64.deb

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-apple-darwin.tar.gz
          tar -xzf ripgrep-15.2.0-x86_64-apple-darwin.tar.gz
          echo "$(pwd)/ripgrep-15.2.0-x86_64-apple-darwin" >> $GITHUB_PATH

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
          unzip ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
          echo "$(pwd)/ripgrep-15.2.0-x86_64-pc-windows-msvc" >> $GITHUB_PATH

      - name: cargo test
        run: cargo test

      - name: cargo test (oracle PR suite)
        run: cargo test --test oracle_self --test oracle_cli --features oracle

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  test-context:
    # The context engine is a workspace member; root-level `cargo test` and
    # `cargo clippy` select only the `syntext` package, so it gets its own job.
    name: Test (syntext-context, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: context-${{ matrix.os }}

      - name: cargo test -p syntext-context
        run: cargo test -p syntext-context

      - name: cargo test -p syntext-context --features ffi
        run: cargo test -p syntext-context --features ffi

      - name: cargo clippy -p syntext-context
        # --no-deps: lint this crate, not `syntext` built without its `cli` feature.
        run: |
          cargo clippy -p syntext-context --all-targets --no-deps -- -D warnings
          cargo clippy -p syntext-context --all-targets --features ffi --no-deps -- -D warnings

  test-musl:
    # Links and runs the full default-feature suite natively under musl,
    # guarding the static *-musl release binaries. The rust:alpine image has
    # no rustup, so rust-toolchain.toml is inert and the image's stable
    # toolchain is used. git is needed by actions/checkout and by the
    # freshness/CLI tests; build-base provides the musl C toolchain for
    # blake3; the pinned ripgrep satisfies the correctness oracle's exact
    # 15.2.0 version check (below, in the install step).
    name: Test (musl)
    runs-on: ubuntu-latest
    container:
      image: rust:alpine
    steps:
      - name: Install build deps + pinned ripgrep
        run: |
          apk add --no-cache git build-base curl
          # The correctness suite pins ripgrep 15.2.0 exactly; Alpine's
          # packaged version drifts, so install the official static musl
          # build (the runner is x86_64, matching this container).
          curl -sLO https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          tar -xzf ripgrep-15.2.0-x86_64-unknown-linux-musl.tar.gz
          install -m755 ripgrep-15.2.0-x86_64-unknown-linux-musl/rg /usr/local/bin/rg
          rg --version

      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-unknown-linux-musl

      - name: cargo test (native musl)
        run: cargo test

  test-symbols:
    name: Test (symbols feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --features symbols
        run: cargo test --features symbols

  test-ffi:
    name: Test (ffi feature, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the only platform the xcframework actually ships for
        # (test-swift below); ubuntu is kept for fast general coverage. The
        # ffi Rust test target must run on both so a macOS-only regression in
        # the C ABI isn't caught only after the xcframework build.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.os }}

      - name: cargo test --features ffi
        run: cargo test --features ffi

      - name: cargo clippy --features ffi
        run: cargo clippy --all-targets --features ffi -- -D warnings

  test-swift:
    name: Swift package (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-xcframework

      - name: Build xcframework
        run: ./swift/Scripts/build-xcframework.sh

      - name: swift test
        working-directory: swift
        run: swift test
