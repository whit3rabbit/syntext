name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ripgrep (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep_15.2.0-1_amd64.deb
          sudo dpkg -i ripgrep_15.2.0-1_amd64.deb

      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-apple-darwin.tar.gz
          tar -xzf ripgrep-15.2.0-x86_64-apple-darwin.tar.gz
          echo "$(pwd)/ripgrep-15.2.0-x86_64-apple-darwin" >> $GITHUB_PATH

      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -LO https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
          unzip ripgrep-15.2.0-x86_64-pc-windows-msvc.zip
          echo "$(pwd)/ripgrep-15.2.0-x86_64-pc-windows-msvc" >> $GITHUB_PATH

      - name: cargo test
        run: cargo test

      - name: cargo test (oracle PR suite)
        run: cargo test --test oracle_self --test oracle_cli --features oracle

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  test-symbols:
    name: Test (symbols feature)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test --features symbols
        run: cargo test --features symbols

  test-ffi:
    name: Test (ffi feature, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the only platform the xcframework actually ships for
        # (test-swift below); ubuntu is kept for fast general coverage. The
        # ffi Rust test target must run on both so a macOS-only regression in
        # the C ABI isn't caught only after the xcframework build.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ffi-${{ matrix.os }}

      - name: cargo test --features ffi
        run: cargo test --features ffi

      - name: cargo clippy --features ffi
        run: cargo clippy --all-targets --features ffi -- -D warnings

  test-swift:
    name: Swift package (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-xcframework

      - name: Build xcframework
        run: ./swift/Scripts/build-xcframework.sh

      - name: swift test
        working-directory: swift
        run: swift test
