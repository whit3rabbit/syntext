name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build-linux:
    name: Linux ${{ matrix.suffix }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: linux-amd64
          - target: aarch64-unknown-linux-gnu
            suffix: linux-arm64
          - target: x86_64-unknown-linux-musl
            suffix: linux-amd64-musl
          - target: aarch64-unknown-linux-musl
            suffix: linux-arm64-musl
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install cargo-deb
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo install cargo-deb

      - name: Build binary
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify static linking (musl)
        if: endsWith(matrix.target, '-musl')
        run: |
          BIN="target/${{ matrix.target }}/release/st"
          file "${BIN}"
          # Rust links x86_64 musl as static-pie, which `file` reports as
          # "static-pie linked" (no interpreter, no shared deps); aarch64
          # comes out plain "statically linked". Both are fully static.
          if ! file "${BIN}" | grep -Eq 'statically linked|static-pie linked'; then
            echo "::error::musl binary is not statically linked"
            exit 1
          fi

      - name: Smoke test x86_64 musl binary (native + old glibc container)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          BIN="target/${{ matrix.target }}/release/st"
          "${BIN}" --version
          # manylinux2014 = glibc 2.17: proves the static binary runs where the
          # gnu build would fail with GLIBC_x.yy-not-found.
          docker run --rm -v "${PWD}/${BIN}:/st:ro" quay.io/pypa/manylinux2014_x86_64 /st --version

      - name: Report glibc floor (gnu amd64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          BIN="target/${{ matrix.target }}/release/st"
          FLOOR=$(objdump -T "${BIN}" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -n1 | sed 's/^GLIBC_//')
          echo "## Linux glibc floor" >> "$GITHUB_STEP_SUMMARY"
          echo "gnu amd64 binary requires glibc >= ${FLOOR}. install.sh REQUIRED_GLIBC must be >= this; refresh it if it moved." >> "$GITHUB_STEP_SUMMARY"

      - name: Stage binary and deb
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          cp "target/${TARGET}/release/st" "dist/st-${VER}-${SUFFIX}"
          if [ "${TARGET}" = "x86_64-unknown-linux-gnu" ]; then
            cargo deb --no-build --target "${TARGET}" \
              --output "dist/syntext_${VER}_amd64.deb"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.suffix }}
          path: dist/

  build-macos:
    name: macOS ${{ matrix.suffix }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            suffix: macos-arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: macos-x86_64
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary
        env:
          TARGET: ${{ matrix.target }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          cp "target/${TARGET}/release/st" "dist/st-${VER}-${SUFFIX}"
          # zip for Homebrew cask; archive must contain a file named "st" so brew links it correctly
          cp "target/${TARGET}/release/st" dist/st
          cd dist && zip "st-${VER}-${SUFFIX}.zip" st && rm st

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: dist/

  build-windows:
    name: Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Stage binary
        env:
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          cp "target/x86_64-pc-windows-msvc/release/st.exe" "dist/st-${VER}-windows-amd64.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-amd64
          path: dist/

  build-wasm:
    name: WASM (bundler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build --target bundler -- --features wasm --no-default-features

      - name: Package artifact
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          mkdir -p dist
          tar -czf "dist/syntext-wasm-${VER}.tar.gz" -C pkg .

      - uses: actions/upload-artifact@v7
        with:
          name: wasm-bundler
          path: dist/

  # Does this tag pin its own xcframework? The Swift prepare workflow stages
  # the zip on a draft release and pins both Package.swift files to it before
  # the tag exists, so the tag carries its own url + checksum and SwiftPM can
  # resolve `exact: "X.Y.Z"`. Then this job verifies the staged zip against
  # the pin and hands that exact zip to the release (a rebuild would not
  # reproduce the checksum). A tag without that pin takes the legacy path:
  # build-swift builds a zip and update-swift-package pins main afterwards.
  swift-staged:
    name: Swift xcframework (staged)
    runs-on: ubuntu-latest
    permissions:
      # Draft releases and their assets are visible only with push access.
      contents: write
    outputs:
      staged: ${{ steps.pin.outputs.staged }}
    steps:
      - uses: actions/checkout@v5

      - name: Check whether the tag pins its own zip
        id: pin
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          URL="https://github.com/whit3rabbit/syntext/releases/download/v${VER}/syntext-swift-${VER}.xcframework.zip"
          if grep -qF "url: \"${URL}\"" Package.swift && grep -qF "url: \"${URL}\"" swift/Package.swift; then
            echo "staged=true" >> "$GITHUB_OUTPUT"
          else
            echo "staged=false" >> "$GITHUB_OUTPUT"
            echo "::warning::v${VER} does not pin its own xcframework, so an exact v${VER} SwiftPM pin gets the previous release's zip. Building one and pinning main afterwards (legacy flow). Run the Swift prepare workflow before tagging."
          fi

      - name: Fetch the staged zip and check it against the pin
        if: steps.pin.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          ZIP="syntext-swift-${VER}.xcframework.zip"
          mkdir -p dist
          if ! gh release download "v${VER}" --pattern "${ZIP}" --dir dist; then
            echo "::error::the tag pins ${ZIP}, but no draft release v${VER} holds it. Run the Swift prepare workflow for ${VER}."
            exit 1
          fi
          SUM="$(sha256sum "dist/${ZIP}" | awk '{print $1}')"
          for f in Package.swift swift/Package.swift; do
            if ! grep -qF "checksum: \"${SUM}\"" "${f}"; then
              echo "::error::${f} pins a checksum other than the staged ${ZIP} (${SUM}). Re-run the Swift prepare workflow and re-tag from its pin PR."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        if: steps.pin.outputs.staged == 'true'
        with:
          name: swift-xcframework
          path: dist/

  build-swift:
    name: Swift xcframework (legacy build)
    needs: [swift-staged]
    if: needs.swift-staged.outputs.staged != 'true'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: swift-xcframework

      - name: Build xcframework
        env:
          SYNTEXT_SWIFT_ZIP_OUT: dist
        run: ./swift/Scripts/build-xcframework.sh

      # The release job generates SHA256SUMS over all artifacts; the per-zip
      # .sha256 sidecar is redundant there.
      - name: Drop checksum sidecar
        run: rm -f dist/*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: swift-xcframework
          path: dist/

  release:
    name: Publish GitHub Release
    needs: [build-linux, build-macos, build-windows, build-wasm, swift-staged, build-swift]
    # build-swift is skipped on the staged path; a skipped need would skip
    # this job too without the explicit condition.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Extract release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          python3 scripts/extract_release_notes.py "${VERSION}" > release_notes.md
          echo "=== Extracted Release Notes ==="
          cat release_notes.md
          echo "==============================="

      - uses: softprops/action-gh-release@v3
        if: needs.swift-staged.outputs.staged != 'true'
        with:
          files: artifacts/*
          body_path: release_notes.md
          generate_release_notes: true

      # Staged path: the draft release already holds the zip the tag pins.
      # Add the other artifacts (the zip is the same bytes, downloaded from
      # the draft, so SHA256SUMS covers it) and publish that draft.
      - name: Publish the staged draft release
        if: needs.swift-staged.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="${TAG}" --jq .body > generated_notes.md
          printf '\n' >> release_notes.md
          cat generated_notes.md >> release_notes.md
          gh release upload "${TAG}" artifacts/* --clobber
          gh release edit "${TAG}" --draft=false --verify-tag --title "${TAG}" --notes-file release_notes.md

      # Consumers that pin `swift-vX.Y.Z` (the legacy convention) keep working.
      - name: Tag swift-vX.Y.Z at the release commit
        if: needs.swift-staged.outputs.staged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/swift-${TAG}" -f sha="${GITHUB_SHA}"

  publish-crate:
    name: Publish to crates.io
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Detect existing crates.io release
        id: crate
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          if curl -fsSL "https://crates.io/api/v1/crates/syntext/${VER}" >/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set +e
          cargo publish 2>&1 | tee /tmp/cargo-publish.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "${status}" -eq 0 ]; then
            exit 0
          fi
          if grep -F "already exists on crates.io index" /tmp/cargo-publish.log >/dev/null; then
            exit 0
          fi
          exit "${status}"

  update-homebrew-cask:
    name: Update Homebrew Cask
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Detect tap token
        id: tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "${TAP_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set version
        id: ver
        run: echo "VER=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256 from published release assets
        id: sha
        env:
          VER: ${{ steps.ver.outputs.VER }}
        run: |
          BASE="https://github.com/whit3rabbit/syntext/releases/download/v${VER}"
          curl -fsSL "${BASE}/st-${VER}-macos-arm64.zip" -o arm64.zip
          curl -fsSL "${BASE}/st-${VER}-macos-x86_64.zip" -o x86_64.zip
          ARM_SHA=$(sha256sum arm64.zip | awk '{print $1}')
          X86_SHA=$(sha256sum x86_64.zip | awk '{print $1}')
          echo "arm=${ARM_SHA}" >> "$GITHUB_OUTPUT"
          echo "x86=${X86_SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.tap.outputs.available == 'true'
        with:
          repository: whit3rabbit/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Generate cask
        if: steps.tap.outputs.available == 'true'
        env:
          VER: ${{ steps.ver.outputs.VER }}
          ARM: ${{ steps.sha.outputs.arm }}
          X86: ${{ steps.sha.outputs.x86 }}
        run: |
          chmod +x scripts/render_homebrew_cask.sh
          scripts/render_homebrew_cask.sh \
            packaging/homebrew/Casks/syntext.rb \
            homebrew-tap/Casks/syntext.rb \
            "${VER}" \
            "${ARM}" \
            "${X86}"
          ruby -c homebrew-tap/Casks/syntext.rb

      - name: Commit and push cask
        if: steps.tap.outputs.available == 'true'
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/syntext.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update syntext cask to ${{ steps.ver.outputs.VER }}"
          git push origin main

  update-swift-package:
    name: Pin Swift package to release (legacy flow)
    needs: [swift-staged, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.swift-staged.outputs.staged != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job is triggered by the tag push, so checkout without `ref:`
      # would leave HEAD detached at the tag commit. The pin commit belongs on
      # `main`, and the tag itself carries no information this job needs (the
      # version comes from `github.ref_name`), so check out `main`'s tip
      # directly instead of committing onto a commit that may already be
      # behind it.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Compute checksum from published release asset
        id: sha
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          VER="${VERSION#v}"
          BASE="https://github.com/whit3rabbit/syntext/releases/download/v${VER}"
          curl -fsSL "${BASE}/syntext-swift-${VER}.xcframework.zip" -o "syntext-swift-${VER}.xcframework.zip"
          echo "SHA=$(shasum -a 256 "syntext-swift-${VER}.xcframework.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "VER=${VER}" >> "$GITHUB_OUTPUT"

      - name: Pin Package.swift url + checksum
        env:
          VER: ${{ steps.sha.outputs.VER }}
          SHA: ${{ steps.sha.outputs.SHA }}
        run: python3 scripts/pin_swift_package.py "${VER}" "${SHA}"

      - name: Commit, push, and tag
        env:
          VER: ${{ steps.sha.outputs.VER }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add swift/Package.swift Package.swift
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "swift: pin v${VER} xcframework"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "::error::failed to push swift/Package.swift pin to main after 5 attempts"
              exit 1
            fi
            git fetch origin main
            git rebase origin/main
          done
          git tag "swift-v${VER}"
          git push origin "swift-v${VER}"
